<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialSentinel - Instagram Feed Engine</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/main.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <aside class="ig-sidebar">
    <a href="/" class="ig-brand">
      <img src="static/img/logo.png" alt="Logo" onerror="this.src='https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=100&auto=format&fit=crop&q=80'">
      <span class="ig-brand-text">Instagram</span>
    </a>

    <ul class="ig-nav-list">
      <li class="ig-nav-item"><a href="/"><i class="bi bi-house-door"></i> <span>Home</span></a></li>
      <li class="ig-nav-item"><a href="/contact.html"><i class="bi bi-compass"></i> <span>Explore Search</span></a></li>
      <li class="ig-nav-item"><a href="/engine.html" class="active"><i class="bi bi-play-btn-fill"></i> <span>Feed Engine</span></a></li>
      <li class="ig-nav-item"><a href="/sentiments.html"><i class="bi bi-chat-quote"></i> <span>Sentiment Studio</span></a></li>
      <li class="ig-nav-item"><a href="/reports.html"><i class="bi bi-bar-chart-line"></i> <span>Insights</span></a></li>
      <li class="ig-nav-item"><a href="/api.html"><i class="bi bi-code-slash"></i> <span>Developer API</span></a></li>
      <li class="ig-nav-item mt-auto"><a href="#"><i class="bi bi-person-circle"></i> <span>Profile</span></a></li>
    </ul>
  </aside>

  <!-- Feed Engine -->
  <main class="ig-main-content">
    <div class="ig-feed-container">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Instagram Interactive Feed Engine</h3>
        <p class="text-secondary small">Real-time dwell duration tracking & engagement saved directly to SQLite Database.</p>
      </div>

      <div id="engineFeedContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading Feed...</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let viewTimers = {};

    async function loadEngineFeed() {
      try {
        const res = await fetch('/get_posts');
        const posts = await res.json();
        const container = document.getElementById('engineFeedContainer');
        container.innerHTML = '';

        posts.forEach(post => {
          viewTimers[post.id] = Date.now();

          const card = document.createElement('div');
          card.className = 'ig-post-card';
          card.innerHTML = `
            <div class="ig-post-header">
              <div class="ig-post-userinfo">
                <img src="${post.user_avatar}" class="ig-post-avatar" alt="Avatar">
                <div>
                  <a href="#" class="ig-post-username">${post.username}</a>
                  <div class="ig-post-location">${post.location}</div>
                </div>
              </div>
              <span class="badge bg-light text-dark border">Engine Tracking</span>
            </div>

            <div class="ig-post-media">
              <img src="${post.image_url}" alt="Post Media">
              <div class="ig-sentiment-badge">
                <span class="badge-dot badge-dot-positive"></span>
                ${post.sentiment} (${(post.score * 100).toFixed(0)}%)
              </div>
            </div>

            <div class="ig-post-actions">
              <div class="ig-action-left">
                <button class="ig-action-btn" onclick="saveEngineInteraction(${post.id}, 'like', '${post.caption}', '${post.hashtags}')"><i class="bi bi-heart-fill text-danger"></i></button>
                <button class="ig-action-btn" onclick="saveEngineComment(${post.id}, '${post.caption}', '${post.hashtags}')"><i class="bi bi-chat"></i></button>
                <button class="ig-action-btn" onclick="saveEngineInteraction(${post.id}, 'share', '${post.caption}', '${post.hashtags}')"><i class="bi bi-send"></i></button>
              </div>
              <button class="ig-action-btn"><i class="bi bi-bookmark"></i></button>
            </div>

            <div class="ig-post-details">
              <div class="ig-likes-count">${post.likes_count.toLocaleString()} likes</div>
              <div class="ig-caption-text">
                <span class="ig-caption-username">${post.username}</span>
                ${post.caption}
              </div>
              <div class="ig-hashtags">${post.hashtags}</div>
              <div class="ig-post-time">${post.timestamp}</div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading engine feed:', err);
      }
    }

    async function saveEngineInteraction(postId, action, caption, hashtags) {
      const duration = (Date.now() - (viewTimers[postId] || Date.now())) / 1000;
      const res = await fetch('/save_post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: postId,
          caption: caption,
          hashtags: hashtags,
          duration: duration,
          liked: action === 'like',
          shared: action === 'share'
        })
      });
      alert(`Action saved to Database! (${action.toUpperCase()}) - View Dwell Time: ${duration.toFixed(1)}s`);
    }

    async function saveEngineComment(postId, caption, hashtags) {
      const comment = prompt("Enter your comment:");
      if (!comment) return;
      const duration = (Date.now() - (viewTimers[postId] || Date.now())) / 1000;

      await fetch('/save_post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: postId,
          caption: caption,
          hashtags: hashtags,
          duration: duration,
          comment: comment
        })
      });
      alert(`Comment saved to Database: "${comment}"`);
    }

    document.addEventListener('DOMContentLoaded', loadEngineFeed);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
