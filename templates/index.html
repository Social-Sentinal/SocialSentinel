<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialSentinel - Instagram Web UI Feed</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="static/css/main.css" rel="stylesheet">
</head>
<body>

  <!-- Instagram Left Fixed Sidebar Navigation -->
  <aside class="ig-sidebar">
    <a href="/" class="ig-brand">
      <img src="static/img/logo.png" alt="Logo" onerror="this.src='https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=100&auto=format&fit=crop&q=80'">
      <span class="ig-brand-text">Instagram</span>
    </a>

    <ul class="ig-nav-list">
      <li class="ig-nav-item"><a href="/" class="active"><i class="bi bi-house-door-fill"></i> <span>Home</span></a></li>
      <li class="ig-nav-item"><a href="/contact.html"><i class="bi bi-compass"></i> <span>Explore Search</span></a></li>
      <li class="ig-nav-item"><a href="/engine.html"><i class="bi bi-play-btn"></i> <span>Feed Engine</span></a></li>
      <li class="ig-nav-item"><a href="/sentiments.html"><i class="bi bi-chat-quote"></i> <span>Sentiment Studio</span></a></li>
      <li class="ig-nav-item"><a href="/reports.html"><i class="bi bi-bar-chart-line"></i> <span>Insights</span></a></li>
      <li class="ig-nav-item"><a href="/api.html"><i class="bi bi-code-slash"></i> <span>Developer API</span></a></li>
      <li class="ig-nav-item mt-auto"><a href="#"><i class="bi bi-person-circle"></i> <span>Profile</span></a></li>
    </ul>
  </aside>

  <!-- Instagram Main Feed Content -->
  <main class="ig-main-content">
    <div class="ig-feed-container">

      <!-- Top Stories Bar -->
      <div class="ig-stories-bar">
        <div class="ig-story-item">
          <div class="ig-story-ring">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="ig-story-avatar" alt="Story">
          </div>
          <span class="ig-story-username">humansofny</span>
        </div>
        <div class="ig-story-item">
          <div class="ig-story-ring">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" class="ig-story-avatar" alt="Story">
          </div>
          <span class="ig-story-username">travel_pro</span>
        </div>
        <div class="ig-story-item">
          <div class="ig-story-ring">
            <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80" class="ig-story-avatar" alt="Story">
          </div>
          <span class="ig-story-username">urban_shots</span>
        </div>
        <div class="ig-story-item">
          <div class="ig-story-ring">
            <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?w=150&auto=format&fit=crop&q=80" class="ig-story-avatar" alt="Story">
          </div>
          <span class="ig-story-username">foodie_gram</span>
        </div>
        <div class="ig-story-item">
          <div class="ig-story-ring">
            <img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=150&auto=format&fit=crop&q=80" class="ig-story-avatar" alt="Story">
          </div>
          <span class="ig-story-username">street_art</span>
        </div>
      </div>

      <!-- Feed Posts Container -->
      <div id="mainFeedContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading Instagram Feed...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function loadInstagramFeed() {
      try {
        const res = await fetch('/get_posts');
        const posts = await res.json();
        const container = document.getElementById('mainFeedContainer');
        container.innerHTML = '';

        posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'ig-post-card';
          
          const dotClass = post.sentiment === 'Positive' ? 'badge-dot-positive' :
                           post.sentiment === 'Negative' ? 'badge-dot-negative' : 'badge-dot-neutral';

          card.innerHTML = `
            <div class="ig-post-header">
              <div class="ig-post-userinfo">
                <img src="${post.user_avatar}" class="ig-post-avatar" alt="Avatar">
                <div>
                  <a href="#" class="ig-post-username">${post.username}</a>
                  <div class="ig-post-location">${post.location}</div>
                </div>
              </div>
              <i class="bi bi-three-dots ig-post-more"></i>
            </div>

            <div class="ig-post-media">
              <img src="${post.image_url}" alt="Post Media">
              <div class="ig-sentiment-badge">
                <span class="badge-dot ${dotClass}"></span>
                ${post.sentiment} (${(post.score * 100).toFixed(0)}%)
              </div>
            </div>

            <div class="ig-post-actions">
              <div class="ig-action-left">
                <button class="ig-action-btn" onclick="toggleLike(this, ${post.id})"><i class="bi bi-heart"></i></button>
                <button class="ig-action-btn"><i class="bi bi-chat"></i></button>
                <button class="ig-action-btn"><i class="bi bi-send"></i></button>
              </div>
              <button class="ig-action-btn"><i class="bi bi-bookmark"></i></button>
            </div>

            <div class="ig-post-details">
              <div class="ig-likes-count" id="likes-${post.id}">${post.likes_count.toLocaleString()} likes</div>
              <div class="ig-caption-text">
                <span class="ig-caption-username">${post.username}</span>
                ${post.caption}
              </div>
              <div class="ig-hashtags">${post.hashtags}</div>
              <div class="text-muted small mt-1">View all ${post.comments_count} comments</div>
              <div class="ig-post-time">${post.timestamp}</div>
            </div>

            <div class="ig-comment-section">
              <i class="bi bi-emoji-smile fs-5 text-muted"></i>
              <input type="text" class="ig-comment-input" placeholder="Add a comment..." id="comment-input-${post.id}">
              <button class="ig-comment-submit" onclick="submitComment(${post.id})">Post</button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading Instagram feed:', err);
      }
    }

    function toggleLike(btn, postId) {
      const heartIcon = btn.querySelector('i');
      const likesElem = document.getElementById(`likes-${postId}`);
      let currentLikes = parseInt(likesElem.innerText.replace(/,/g, '')) || 1200;

      if (heartIcon.classList.contains('bi-heart')) {
        heartIcon.className = 'bi bi-heart-fill text-danger';
        likesElem.innerText = (currentLikes + 1).toLocaleString() + ' likes';
      } else {
        heartIcon.className = 'bi bi-heart';
        likesElem.innerText = (currentLikes - 1).toLocaleString() + ' likes';
      }
    }

    function submitComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (input.value.trim()) {
        alert(`Comment posted: "${input.value}"`);
        input.value = '';
      }
    }

    document.addEventListener('DOMContentLoaded', loadInstagramFeed);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
