<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialSentinel - Social Media Intelligence Platform</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- React 18, Babel, Chart.js, SweetAlert2 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link href="/static/css/main.css" rel="stylesheet">
</head>
<body>

  <!-- React 18 Root Mounting Point -->
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    {% raw %}
    const { useState, useEffect, useRef } = React;

    // --- Main Application Component ---
    function SocialSentinelApp() {
      const [activeTab, setActiveTab] = useState('feed');
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [savedPosts, setSavedPosts] = useState({});
      const [likedPosts, setLikedPosts] = useState({});

      // Comment & Share Modal States
      const [selectedPostId, setSelectedPostId] = useState(null);
      const [commentText, setCommentText] = useState('');
      const [showCommentModal, setShowCommentModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);

      // Explore Search State
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [searching, setSearching] = useState(false);

      // Sentiment Analysis State
      const [sentimentInput, setSentimentInput] = useState('');
      const [sentimentResult, setSentimentResult] = useState(null);
      const [emotionsResult, setEmotionsResult] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);

      const sentimentChartRef = useRef(null);
      const emotionChartRef = useRef(null);
      const sentimentChartInst = useRef(null);
      const emotionChartInst = useRef(null);

      // Fetch initial feed posts from REST API
      useEffect(() => {
        fetchPosts();
      }, []);

      const fetchPosts = async () => {
        try {
          const res = await fetch('/api/v1/posts');
          const json = await res.json();
          if (json.status === 'success') {
            setPosts(json.data);
          }
        } catch (err) {
          console.error('Error fetching posts:', err);
        } finally {
          setLoading(false);
        }
      };

      // Handle Post Like Action
      const handleLike = async (postId) => {
        const isCurrentlyLiked = !!likedPosts[postId];
        const newLikedState = !isCurrentlyLiked;
        
        setLikedPosts(prev => ({ ...prev, [postId]: newLikedState }));
        setPosts(prev => prev.map(p => {
          if (p.id === postId) {
            return { ...p, likes_count: newLikedState ? p.likes_count + 1 : Math.max(0, p.likes_count - 1) };
          }
          return p;
        }));

        try {
          await fetch(`/api/v1/posts/${postId}/like`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ liked: newLikedState })
          });
          if (newLikedState) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Post Liked', showConfirmButton: false, timer: 1500 });
          }
        } catch (err) {
          console.error('Error updating like:', err);
        }
      };

      // Handle Bookmark Action
      const handleBookmark = (postId) => {
        setSavedPosts(prev => {
          const isSaved = !prev[postId];
          if (isSaved) {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Saved to Bookmarks', showConfirmButton: false, timer: 1500 });
          }
          return { ...prev, [postId]: isSaved };
        });
      };

      // Handle Comment Modal Open & Submit
      const openCommentModal = (postId) => {
        setSelectedPostId(postId);
        setCommentText('');
        setShowCommentModal(true);
      };

      const handleAddComment = async () => {
        if (!commentText.trim() || !selectedPostId) return;

        try {
          const res = await fetch(`/api/v1/posts/${selectedPostId}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: commentText, username: 'social_explorer' })
          });
          const json = await res.json();
          if (json.status === 'success') {
            setPosts(prev => prev.map(p => {
              if (p.id === selectedPostId) {
                return { ...p, comments_count: json.comments_count, comments_list: [...p.comments_list, json.data] };
              }
              return p;
            }));
            setShowCommentModal(false);
            Swal.fire({ icon: 'success', title: 'Comment Posted', text: `"${commentText}" saved to database.`, timer: 1800, showConfirmButton: false });
          }
        } catch (err) {
          console.error('Error adding comment:', err);
        }
      };

      // Handle Explore Search Submit
      const handleSearchSubmit = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;
        setSearching(true);

        try {
          const formData = new FormData();
          formData.append('user_input', searchQuery);
          const res = await fetch('/contact.html', {
            method: 'POST',
            body: formData
          });
          const text = await res.text();
          
          // Fetch recommendation posts via Word2Vec backend
          const apiRes = await fetch(`/get_pts`);
          const apiJson = await apiRes.json();
          setSearchResults(apiJson);
        } catch (err) {
          console.error('Search error:', err);
        } finally {
          setSearching(false);
        }
      };

      // Handle Sentiment Analysis Submit
      const handleSentimentSubmit = async (e) => {
        e.preventDefault();
        if (!sentimentInput.trim()) return;
        setAnalyzing(true);

        try {
          const formData = new FormData();
          formData.append('text', sentimentInput);

          const [sentRes, emoRes] = await Promise.all([
            fetch('/predict', { method: 'POST', body: formData }),
            fetch('/emotion', { method: 'POST', body: formData })
          ]);

          const sentJson = await sentRes.json();
          const emoJson = await emoRes.json();

          setSentimentResult(sentJson);
          setEmotionsResult(emoJson);
        } catch (err) {
          console.error('Sentiment Analysis error:', err);
        } finally {
          setAnalyzing(false);
        }
      };

      // Render Sentiment Charts when Result arrives
      useEffect(() => {
        if (sentimentResult && sentimentChartRef.current) {
          if (sentimentChartInst.current) sentimentChartInst.current.destroy();
          sentimentChartInst.current = new Chart(sentimentChartRef.current, {
            type: 'doughnut',
            data: {
              labels: ['Positive', 'Neutral', 'Negative'],
              datasets: [{
                data: [sentimentResult.distribution.positive, sentimentResult.distribution.neutral, sentimentResult.distribution.negative],
                backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }

        if (emotionsResult && emotionChartRef.current) {
          if (emotionChartInst.current) emotionChartInst.current.destroy();
          emotionChartInst.current = new Chart(emotionChartRef.current, {
            type: 'bar',
            data: {
              labels: Object.keys(emotionsResult.emotions),
              datasets: [{
                label: 'Intensity Score',
                data: Object.values(emotionsResult.emotions),
                backgroundColor: '#6366f1'
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
      }, [sentimentResult, emotionsResult]);

      return (
        <div>
          {/* Left Sidebar */}
          <aside className="ss-sidebar">
            <a href="/" className="ss-brand">
              <img src="/static/img/logo.png" alt="Logo" onError={(e) => e.target.src='https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=100&auto=format&fit=crop&q=80'} />
              <span className="ss-brand-text">SocialSentinel</span>
            </a>

            <ul className="ss-nav-list">
              <li className="ss-nav-item">
                <a href="#" className={activeTab === 'feed' ? 'active' : ''} onClick={() => setActiveTab('feed')}>
                  <i className={`bi ${activeTab === 'feed' ? 'bi-house-door-fill' : 'bi-house-door'}`}></i>
                  <span>Home Feed</span>
                </a>
              </li>
              <li className="ss-nav-item">
                <a href="#" className={activeTab === 'explore' ? 'active' : ''} onClick={() => setActiveTab('explore')}>
                  <i className={`bi ${activeTab === 'explore' ? 'bi-compass-fill' : 'bi-compass'}`}></i>
                  <span>Explore Search</span>
                </a>
              </li>
              <li className="ss-nav-item">
                <a href="#" className={activeTab === 'engine' ? 'active' : ''} onClick={() => setActiveTab('engine')}>
                  <i className={`bi ${activeTab === 'engine' ? 'bi-play-btn-fill' : 'bi-play-btn'}`}></i>
                  <span>Feed Engine</span>
                </a>
              </li>
              <li className="ss-nav-item">
                <a href="#" className={activeTab === 'sentiment' ? 'active' : ''} onClick={() => setActiveTab('sentiment')}>
                  <i className={`bi ${activeTab === 'sentiment' ? 'bi-chat-quote-fill' : 'bi-chat-quote'}`}></i>
                  <span>Sentiment Studio</span>
                </a>
              </li>
              <li className="ss-nav-item">
                <a href="#" className={activeTab === 'insights' ? 'active' : ''} onClick={() => setActiveTab('insights')}>
                  <i className={`bi ${activeTab === 'insights' ? 'bi-bar-chart-line-fill' : 'bi-bar-chart-line'}`}></i>
                  <span>Analytics Insights</span>
                </a>
              </li>

            
              <li className="ss-nav-item dropdown">
                <button className="dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <i className="bi bi-shield-lock"></i> <span>Admin Access</span>
                </button>
                <ul className="dropdown-menu admin-dropdown-menu">
                  <li>
                    <a className="dropdown-item" href="#" onClick={() => setActiveTab('api')}>
                      <i className="bi bi-code-slash text-primary"></i> Developer API Portal
                    </a>
                  </li>
                </ul>
              </li>

              <li className="ss-nav-item mt-auto">
                <a href="#"><i className="bi bi-person-circle"></i> <span>Profile</span></a>
              </li>
            </ul>
          </aside>

   
          <main className="ss-main-content">
            <div className="ss-feed-container">

              {/* HOME FEED TAB */}
              {activeTab === 'feed' && (
                <div>
                  {/* Top Stories Bar */}
                  <div className="ss-stories-bar">
                    {['humansofny', 'travel_pro', 'urban_shots', 'foodie_gram', 'street_art'].map((uname, idx) => (
                      <div key={idx} className="ss-story-item">
                        <div className="ss-story-ring">
                          <img src={`https://images.unsplash.com/photo-${1534528741775 + idx * 1000}?w=150&auto=format&fit=crop&q=80`} className="ss-story-avatar" alt="Story" />
                        </div>
                        <span className="ss-story-username">{uname}</span>
                      </div>
                    ))}
                  </div>

                  {/* Posts List */}
                  {loading ? (
                    <div className="text-center py-5">
                      <div className="spinner-border text-primary" role="status">
                        <span className="visually-hidden">Loading Feed...</span>
                      </div>
                    </div>
                  ) : (
                    posts.map(post => (
                      <div key={post.id} className="ss-post-card">
                        <div className="ss-post-header">
                          <div className="ss-post-userinfo">
                            <img src={post.user_avatar} className="ss-post-avatar" alt="Avatar" />
                            <div>
                              <a href="#" className="ss-post-username">{post.username}</a>
                              <div className="ss-post-location">{post.location}</div>
                            </div>
                          </div>
                          <i className="bi bi-three-dots ss-post-more"></i>
                        </div>

                        <div className="ss-post-media">
                          <img src={post.image_url} alt="Post Media" />
                          <div className="ss-sentiment-badge">
                            <span className={`badge-dot ${post.sentiment === 'Positive' ? 'badge-dot-positive' : post.sentiment === 'Negative' ? 'badge-dot-negative' : 'badge-dot-neutral'}`}></span>
                            {post.sentiment} ({Math.round(post.score * 100)}%)
                          </div>
                        </div>

                        <div className="ss-post-actions">
                          <div className="ss-action-left">
                            <button className={`ss-action-btn ${likedPosts[post.id] ? 'liked' : ''}`} onClick={() => handleLike(post.id)}>
                              <i className={`bi ${likedPosts[post.id] ? 'bi-heart-fill' : 'bi-heart'}`}></i>
                            </button>
                            <button className="ss-action-btn" onClick={() => openCommentModal(post.id)}>
                              <i className="bi bi-chat"></i>
                            </button>
                            <button className="ss-action-btn" onClick={() => setShowShareModal(true)}>
                              <i className="bi bi-send"></i>
                            </button>
                          </div>
                          <button className="ss-action-btn" onClick={() => handleBookmark(post.id)}>
                            <i className={`bi ${savedPosts[post.id] ? 'bi-bookmark-fill text-primary' : 'bi-bookmark'}`}></i>
                          </button>
                        </div>

                        <div className="ss-post-details">
                          <div className="ss-likes-count">{post.likes_count.toLocaleString()} likes</div>
                          <div className="ss-caption-text">
                            <span className="ss-caption-username">{post.username}</span>
                            {post.caption}
                          </div>
                          <div className="ss-hashtags">{post.hashtags}</div>
                          
                          {/* Comments Preview */}
                          {post.comments_list && post.comments_list.length > 0 && (
                            <div className="mt-2 pt-2 border-top">
                              {post.comments_list.map(c => (
                                <div key={c.id} className="small mb-1">
                                  <strong>@{c.username}:</strong> {c.text}
                                </div>
                              ))}
                            </div>
                          )}

                          <div className="text-muted small mt-2">View all {post.comments_count} comments</div>
                          <div className="ss-post-time">{post.timestamp}</div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* EXPLORE SEARCH TAB */}
              {activeTab === 'explore' && (
                <div>
                  <div className="text-center mb-4">
                    <h3 className="fw-bold">Explore Content Search</h3>
                    <p className="text-secondary small">Calculate Word2Vec embeddings & Cosine Similarity scores.</p>
                  </div>

                  <form onSubmit={handleSearchSubmit} className="ss-post-card p-3 mb-4">
                    <div className="input-group">
                      <span className="input-group-text bg-transparent border-0"><i className="bi bi-search text-muted fs-5"></i></span>
                      <input type="text" className="form-control border-0 bg-transparent" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="e.g. Mountain hiking coffee vibes nature" required />
                      <button className="btn btn-primary px-4 rounded-3" type="submit" disabled={searching}>
                        {searching ? 'Searching...' : 'Search Explore'}
                      </button>
                    </div>
                  </form>

                  {searchResults.length > 0 && (
                    <div className="row g-3">
                      {searchResults.map(p => (
                        <div key={p.id} className="col-md-6">
                          <div className="ss-post-card h-100 mb-0">
                            <div className="ss-post-header py-2 px-3">
                              <div className="ss-post-userinfo">
                                <img src={p.user_avatar} className="ss-post-avatar" style={{width:'32px',height:'32px'}} alt="Avatar" />
                                <span className="ss-post-username small">{p.username}</span>
                              </div>
                              <span className="badge bg-primary rounded-pill">Word2Vec Match: 92%</span>
                            </div>
                            <div className="ss-post-media">
                              <img src={p.image_url} style={{height:'220px'}} alt="Media" />
                            </div>
                            <div className="p-3">
                              <div className="ss-caption-text text-truncate">{p.caption}</div>
                              <div className="ss-hashtags small">{p.hashtags}</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* FEED ENGINE TAB */}
              {activeTab === 'engine' && (
                <div>
                  <div className="text-center mb-4">
                    <h3 className="fw-bold">Interactive Feed Engine</h3>
                    <p className="text-secondary small">Real-time dwell duration tracking & SQLite DB persistence.</p>
                  </div>
                  {posts.map(post => (
                    <div key={post.id} className="ss-post-card">
                      <div className="ss-post-header">
                        <div className="ss-post-userinfo">
                          <img src={post.user_avatar} className="ss-post-avatar" alt="Avatar" />
                          <span className="ss-post-username">{post.username}</span>
                        </div>
                        <span className="badge bg-light text-dark border">Engine Tracking</span>
                      </div>
                      <div className="ss-post-media">
                        <img src={post.image_url} alt="Post Media" />
                      </div>
                      <div className="p-3">
                        <div className="fw-bold">{post.caption}</div>
                        <div className="ss-hashtags">{post.hashtags}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* SENTIMENT STUDIO TAB */}
              {activeTab === 'sentiment' && (
                <div style={{maxWidth: '750px', margin: '0 auto'}}>
                  <div className="text-center mb-4">
                    <h3 className="fw-bold">Sentiment Analysis Studio</h3>
                    <p className="text-secondary small">Compute TF-IDF polarity and emotion intensity scores.</p>
                  </div>

                  <div className="ss-post-card p-4 mb-4">
                    <form onSubmit={handleSentimentSubmit}>
                      <div className="mb-3">
                        <label className="form-label fw-bold">Social Post Text / Caption:</label>
                        <textarea className="form-control rounded-3" rows="4" value={sentimentInput} onChange={(e) => setSentimentInput(e.target.value)} placeholder="e.g. He was more than my brother; he was my best friend. Excited to start this new journey!" required></textarea>
                      </div>
                      <button type="submit" className="btn btn-primary w-100 py-2 rounded-3 fw-bold" disabled={analyzing}>
                        {analyzing ? 'Analyzing...' : 'Analyze Caption & Save to DB'}
                      </button>
                    </form>
                  </div>

                  {sentimentResult && (
                    <div className="ss-post-card p-4">
                      <h5 className="fw-bold mb-3">Classification Output</h5>
                      <div className="p-3 bg-light rounded-3 border mb-4">
                        <div>Caption: "{sentimentResult.text}"</div>
                        <div className="mt-2">
                          Sentiment: <span className="badge bg-primary me-2">{sentimentResult.sentiment}</span>
                          Confidence: <strong>{(sentimentResult.confidence * 100).toFixed(2)}%</strong>
                        </div>
                      </div>

                      <div className="row g-3">
                        <div className="col-md-6">
                          <div className="bg-light p-3 rounded-3 border text-center">
                            <h6 className="fw-bold mb-3">Sentiment Distribution (%)</h6>
                            <div style={{height: '200px'}}>
                              <canvas ref={sentimentChartRef}></canvas>
                            </div>
                          </div>
                        </div>
                        <div className="col-md-6">
                          <div className="bg-light p-3 rounded-3 border text-center">
                            <h6 className="fw-bold mb-3">Emotion Breakdown</h6>
                            <div style={{height: '200px'}}>
                              <canvas ref={emotionChartRef}></canvas>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ANALYTICS INSIGHTS TAB */}
              {activeTab === 'insights' && (
                <div>
                  <div className="text-center mb-4">
                    <h3 className="fw-bold">Engagement Analytics & Insights</h3>
                    <p className="text-secondary small">Collaborative predictions computed from user dwell-time interactions.</p>
                  </div>
                  <div className="row g-3">
                    {posts.map(p => (
                      <div key={p.id} className="col-md-6">
                        <div className="ss-post-card h-100 mb-0">
                          <div className="ss-post-header py-2 px-3">
                            <span className="fw-bold">{p.username}</span>
                            <span className="badge bg-success">Predicted Score: 0.92</span>
                          </div>
                          <div className="ss-post-media">
                            <img src={p.image_url} style={{height: '220px'}} alt="Media" />
                          </div>
                          <div className="p-3">
                            <div className="fw-bold text-truncate">{p.caption}</div>
                            <div className="ss-hashtags small">{p.hashtags}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ADMIN DEVELOPER API TAB */}
              {activeTab === 'api' && (
                <div>
                  <div className="text-center mb-4">
                    <span className="badge bg-danger mb-2">Admin Portal</span>
                    <h3 className="fw-bold">Developer API Endpoint Console</h3>
                    <p className="text-secondary small">REST JSON API endpoints for posts, recommendations, and analytics.</p>
                  </div>

                  <div className="ss-post-card p-4">
                    <div className="d-flex justify-content-between align-items-center mb-3">
                      <h5 className="fw-bold mb-0">Endpoint: GET `/api/v1/posts`</h5>
                      <a href="/api/v1/posts" target="_blank" className="btn btn-outline-primary btn-sm rounded-3">Open Raw JSON &rarr;</a>
                    </div>
                    <div className="table-responsive">
                      <table className="table table-hover align-middle">
                        <thead className="table-light">
                          <tr>
                            <th>User</th>
                            <th>Caption Preview</th>
                            <th>Sentiment</th>
                            <th>Likes</th>
                            <th>Prediction</th>
                          </tr>
                        </thead>
                        <tbody>
                          {posts.map(p => (
                            <tr key={p.id}>
                              <td><strong>@{p.username}</strong></td>
                              <td><span className="text-truncate d-inline-block" style={{maxWidth: '220px'}}>{p.caption}</span></td>
                              <td><span className="badge bg-primary">{p.sentiment}</span></td>
                              <td><strong>{p.likes_count}</strong></td>
                              <td><span className="text-primary fw-semibold">{p.prediction}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* Centered React Comment Modal */}
          {showCommentModal && (
            <div className="modal fade show d-block" style={{background: 'rgba(0,0,0,0.5)'}} tabIndex="-1">
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title fw-bold"><i className="bi bi-chat-dots text-primary me-2"></i>Add Comment</h5>
                    <button type="button" className="btn-close" onClick={() => setShowCommentModal(false)}></button>
                  </div>
                  <div className="modal-body">
                    <textarea className="form-control rounded-3" rows="3" value={commentText} onChange={(e) => setCommentText(e.target.value)} placeholder="Write your comment..."></textarea>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-light rounded-3" onClick={() => setShowCommentModal(false)}>Cancel</button>
                    <button type="button" className="btn btn-primary rounded-3 px-4" onClick={handleAddComment}>Post Comment</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Centered React Share Modal */}
          {showShareModal && (
            <div className="modal fade show d-block" style={{background: 'rgba(0,0,0,0.5)'}} tabIndex="-1">
              <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title fw-bold"><i className="bi bi-share text-primary me-2"></i>Share Post</h5>
                    <button type="button" className="btn-close" onClick={() => setShowShareModal(false)}></button>
                  </div>
                  <div className="modal-body text-center py-4">
                    <p className="text-secondary mb-4">Share post link across your social network:</p>
                    <div className="d-flex justify-content-center gap-3">
                      <button className="btn btn-outline-primary rounded-circle p-3 fs-4" onClick={() => { setShowShareModal(false); Swal.fire({ icon: 'success', title: 'Link Copied', timer: 1500, showConfirmButton: false }); }}><i className="bi bi-link-45deg"></i></button>
                      <button className="btn btn-outline-success rounded-circle p-3 fs-4" onClick={() => { setShowShareModal(false); Swal.fire({ icon: 'success', title: 'Shared via WhatsApp', timer: 1500, showConfirmButton: false }); }}><i className="bi bi-whatsapp"></i></button>
                      <button className="btn btn-outline-info rounded-circle p-3 fs-4" onClick={() => { setShowShareModal(false); Swal.fire({ icon: 'success', title: 'Shared via Twitter', timer: 1500, showConfirmButton: false }); }}><i className="bi bi-twitter-x"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<SocialSentinelApp />);
    {% endraw %}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
